name: Idea or change request
description: Propose something the project does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Useful context before you write: this project keeps three runtime
        dependencies, stays local-only, and treats "at least once, never lost"
        as a rule rather than a default. Proposals are weighed against those.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do when the project got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Including doing nothing. Sometimes that is the right answer.
    validations:
      required: false
